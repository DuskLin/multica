<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Keep the tile and mark centred at (512, 512), with a 102px tile inset. -->
  <defs>
    <linearGradient id="rim" x2="0" y2="1">
      <stop stop-color="#3b404a"/>
      <stop offset="1" stop-color="#202630"/>
    </linearGradient>
    <linearGradient id="face" x2=".4" y2="1">
      <stop stop-color="#0d121c"/>
      <stop offset="1" stop-color="#252a34"/>
    </linearGradient>
    <linearGradient id="mark" x2="0" y2="1">
      <stop stop-color="#d2d3d5"/>
      <stop offset="1" stop-color="#93969c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <path id="tile" d="M366 102H658C834 102 922 190 922 366V658C922 834 834 922 658 922H366C190 922 102 834 102 658V366C102 190 190 102 366 102Z"/>
